# MLflow Configuration
mlflow:
  tracking_uri: "${MLFLOW_TRACKING_URI:-http://mlflow:5001}"
  experiment_name: "sales_forecasting"
  registry_name: "sales_forecast_models"
  
# Model Configuration
models:
  xgboost:
    params:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      objective: "reg:squarederror"
      random_state: 42
  
  lightgbm:
    params:
      num_leaves: 31
      learning_rate: 0.05
      n_estimators: 100
      objective: "regression"
      random_state: 42
  
  prophet:
    enabled: false  # Set to true if Prophet is working in your environment
    params:
      seasonality_mode: "multiplicative"
      changepoint_prior_scale: 0.05
      seasonality_prior_scale: 10
      yearly_seasonality: true
      weekly_seasonality: true
      daily_seasonality: false

  # Classical time-series baselines (compared + included in ensemble evaluation)
  seasonal_naive:
    enabled: true
    params:
      season_length: 7

  holt_winters:
    enabled: true
    params:
      seasonal: "add"
      seasonal_periods: 7
      trend: "add"
      damped_trend: false
      use_boxcox: false

  sarimax:
    enabled: true
    params:
      order: [1, 1, 1]
      seasonal_order: [1, 1, 1, 7]
      enforce_stationarity: false
      enforce_invertibility: false
      maxiter: 50

# Feature Engineering
features:
  date_features:
    - "year"
    - "month"
    - "day"
    - "dayofweek"
    - "quarter"
    - "weekofyear"
    - "is_weekend"
    - "is_holiday"
  
  lag_features:
    - 1
    - 2
    - 3
    - 7
    - 14
    - 21
    - 30
  
  rolling_features:
    windows: [3, 7, 14, 21, 30]
    functions: ["mean", "std", "min", "max", "median"]

# Data Validation
validation:
  required_columns:
    - "date"
    - "sales"
    - "store_id"
    - "product_id"
  
  data_types:
    date: "datetime64[ns]"
    sales: "float64"
    store_id: "object"
    product_id: "object"
  
  value_ranges:
    sales:
      min: 0
      max: 1000000

# Training Configuration
training:
  test_size: 0.2
  validation_size: 0.1
  cv_folds: 5
  metrics:
    - "rmse"
    - "mae"
    - "mape"
    - "wape"
    - "bias"
    - "r2"
  # Rolling-origin (expanding-window) CV on train+val only; holdout test unchanged
  rolling_origin_cv:
    enabled: true
    n_splits: 5          # falls back to training.cv_folds if omitted
    horizon: null        # null -> inference.prediction_horizon
    step: null           # null -> same as horizon
    min_train_size: null # null -> auto from series length
  # Accuracy + bias at multiple forecast horizons (calendar days on daily aggregate)
  multi_horizon_evaluation:
    enabled: true
    horizons: [1, 3, 7, 14]
    n_splits: 5
    step: null           # null -> max(horizons)
    min_train_size: null
    aggregate_daily: true

# Inference Configuration
inference:
  batch_size: 1000
  prediction_horizon: 30  # days
  confidence_intervals: [0.8, 0.95]

# Workforce staffing (used by include/workforce — not wired into Airflow DAGs)
workforce:
  interval_seconds: 3600      # length of each forecast bucket
  occupancy_target: 0.85      # productive occupancy target
  shrinkage: 0.30             # PTO / meetings / breaks / training
  method: erlang_c            # erlang_c | occupancy
  max_agents: 5000
  service_level:
    target: 0.80              # e.g. 80% answered in answer_time_seconds
    answer_time_seconds: 20

# Monitoring Configuration
monitoring:
  drift_detection:
    enabled: true
    method: "kolmogorov_smirnov"
    threshold: 0.1
  
  performance_monitoring:
    enabled: true
    alert_threshold:
      rmse: 1000
      mape: 0.2

  # Automated forecast quality checks (PASS / WARNING / FAIL)
  forecast_quality:
    enabled: true
    expected_freq: "D"
    bias_warn: 50.0
    bias_fail: 200.0
    relative_bias_warn: 0.10
    relative_bias_fail: 0.25
    rmse_warn: 100.0
    rmse_fail: 500.0
    mae_warn: 80.0
    mae_fail: 400.0
    wape_warn: 15.0
    wape_fail: 40.0
    relative_rmse_warn: 0.25
    relative_rmse_fail: 0.50
    negative_volume_warn: 1
    negative_volume_fail: 10
    negative_prediction_warn: 1
    negative_prediction_fail: 10
    missing_prediction_warn: 0.01
    missing_prediction_fail: 0.05
    missing_timestamp_warn: 1
    missing_timestamp_fail: 5
    duplicate_timestamp_warn: 1
    duplicate_timestamp_fail: 5