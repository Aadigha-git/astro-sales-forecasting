# Extends Astro's compose with MLflow, MinIO, Redis, and Streamlit.
# Code under ./ui and ./include is volume-mounted — rebuild images only when
# Dockerfiles / requirements change, not on every Python edit.
#
# Networking: Astro puts Airflow components on the project ``airflow`` network.
# Sidecars must join ``airflow`` so tasks can resolve ``mlflow`` / ``minio``.
# They also stay on ``default`` so they can reach each other (mlflow ↔ db/minio).

services:
  mlflow:
    build:
      context: ./docker/mlflow
      dockerfile: Dockerfile
    image: astro-salesforecast-mlflow:2.9.2
    platform: linux/arm64
    ports:
      - "5001:5001"
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      - mlflow-db
      - minio
    networks:
      - airflow
      - default
    restart: unless-stopped

  mlflow-db:
    image: postgres:16-alpine
    platform: linux/arm64
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - mlflow-db-volume:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mlflow"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    platform: linux/arm64
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - airflow
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio-mc:
    image: minio/mc:latest
    platform: linux/arm64
    depends_on:
      - minio
    networks:
      - default
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/mlflow-artifacts || true;
      mc anonymous set public myminio/mlflow-artifacts;
      exit 0;
      "

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    expose:
      - 6379
    networks:
      - airflow
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50
    restart: unless-stopped

  # Baked image (deps in layers). App code is mounted for live edits.
  streamlit-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile.streamlit
    image: astro-salesforecast-streamlit:1.32.2
    platform: linux/arm64
    working_dir: /app
    command: ["bash", "./entrypoint.sh"]
    ports:
      - "8501:8501"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5001
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      # /app before include so ui/utils is not shadowed by include/utils
      - PYTHONPATH=/app:/usr/local/airflow/include
      - INCLUDE_PATH=/usr/local/airflow/include
      - ML_CONFIG_PATH=/usr/local/airflow/include/config/ml_config.yaml
    volumes:
      - ./ui:/app
      - ./include:/usr/local/airflow/include:ro
    depends_on:
      - mlflow
      - minio
    networks:
      - airflow
      - default
    restart: unless-stopped

volumes:
  mlflow-db-volume:
  minio-data:

# Declared so override merge joins Astro's project ``airflow`` network
# (do not pin an external hash — Astro generates a project-specific name).
networks:
  airflow:
  default:
